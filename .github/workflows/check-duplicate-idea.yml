name: Check and Store Idea

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# Prevent two ideas from modifying index.json simultaneously.
concurrency:
  group: process-ideas
  cancel-in-progress: false

jobs:
  process-idea:
    runs-on: [self-hosted, idea]

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check runner
        run: |
          echo "================================="
          echo "Self-hosted runner is working!"
          echo "================================="
          echo "Issue number: ${{ github.event.issue.number }}"
          echo "Issue title: ${{ github.event.issue.title }}"
          echo ""
          echo "Git version:"
          git --version
          echo ""
          echo "Node version:"
          node --version

      - name: Process idea submission
        id: process
        uses: actions/github-script@v7
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        with:
          script: |
            const script = require('./scripts/process-idea.js');

            await script({
              github,
              context,
              core
            });

      - name: Commit new idea
        if: steps.process.outputs.added == 'true'
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add ideas/

          if (-not (git diff --cached --quiet)) {
            git commit -m "Add idea from issue #${{ github.event.issue.number }}"
            git push
          }
