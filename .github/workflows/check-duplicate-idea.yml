name: Check and Store Idea

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  process-idea:
    # Only run for issues created via the "Submit an Idea" form (labeled "idea")
    if: contains(github.event.issue.labels.*.name, 'idea')
    runs-on: self-hosted
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Process idea submission
        id: process
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./scripts/process-idea.js');
            await script({ github, context, core });

      - name: Commit new idea file and index
        if: steps.process.outputs.added == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ideas/
          git commit -m "Add idea from issue #${{ github.event.issue.number }}"
          git push
