name: Check and Store Idea

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  process-idea:
    runs-on: [self-hosted, idea]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Test runner
        run: |
          echo "The self-hosted runner is working!"
          echo "Issue number: ${{ github.event.issue.number }}"
          echo "Issue title: ${{ github.event.issue.title }}"

      - name: Process idea submission
        id: process
        uses: actions/github-script@v7
        with:
          script: |
            const script = require('./scripts/process-idea.js');
            await script({ github, context, core });

      - name: Commit new idea file and index
        if: steps.process.outputs.added == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ideas/
          git commit -m "Add idea from issue #${{ github.event.issue.number }}"
          git push
